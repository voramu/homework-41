<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | JWT Auth</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="profile-container">

        <header class="profile-header">
            <div class="logo">AUTH<span>.</span></div>

            <button class="logout-button" id="logoutButton">
                Выйти
            </button>
        </header>

        <section class="profile-content">

            <div class="profile-title">
                <span class="section-label">PERSONAL ACCOUNT</span>
                <h1>Личный кабинет</h1>
                <p>Информация вашего аккаунта</p>
            </div>

            <div id="loading" class="loading">
                Загрузка...
            </div>

            <div id="profileCard" class="profile-card hidden">

                <div class="profile-cover"></div>

                <div class="profile-info">

                    <img
                        id="userImage"
                        class="user-image"
                        src=""
                        alt="Фото пользователя"
                    >

                    <div class="user-heading">
                        <h2 id="userName">Имя пользователя</h2>
                        <span class="user-status">Аккаунт активен</span>
                    </div>

                    <div class="info-grid">

                        <div class="info-item">
                            <span>Email</span>
                            <strong id="userEmail">—</strong>
                        </div>

                        <div class="info-item">
                            <span>Возраст</span>
                            <strong id="userAge">—</strong>
                        </div>

                        <div class="info-item">
                            <span>Город</span>
                            <strong id="userCity">—</strong>
                        </div>

                        <div class="info-item">
                            <span>Имя пользователя</span>
                            <strong id="userUsername">—</strong>
                        </div>

                    </div>

                </div>

            </div>

            <div id="profileError" class="server-error"></div>

        </section>

        <footer class="profile-footer">
            <p>JWT Authentication System © 2026</p>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/profile.js"></script>

</body>
</html>
